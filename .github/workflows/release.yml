name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Get version from tag
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Install xcodegen
      run: brew install xcodegen

    - name: Validate signing secrets
      env:
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
        MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        MACOS_CODE_SIGN_IDENTITY: ${{ secrets.MACOS_CODE_SIGN_IDENTITY }}
        MACOS_APP_PROVISION_PROFILE_BASE64: ${{ secrets.MACOS_APP_PROVISION_PROFILE_BASE64 }}
        MACOS_WIDGET_PROVISION_PROFILE_BASE64: ${{ secrets.MACOS_WIDGET_PROVISION_PROFILE_BASE64 }}
      run: |
        set -e
        test -n "$APPLE_TEAM_ID"
        test -n "$MACOS_CERTIFICATE_P12_BASE64"
        test -n "$MACOS_CERTIFICATE_PASSWORD"
        test -n "$MACOS_CODE_SIGN_IDENTITY"
        test -n "$MACOS_APP_PROVISION_PROFILE_BASE64"
        test -n "$MACOS_WIDGET_PROVISION_PROFILE_BASE64"

    - name: Prepare signing assets
      env:
        KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
        MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        MACOS_APP_PROVISION_PROFILE_BASE64: ${{ secrets.MACOS_APP_PROVISION_PROFILE_BASE64 }}
        MACOS_WIDGET_PROVISION_PROFILE_BASE64: ${{ secrets.MACOS_WIDGET_PROVISION_PROFILE_BASE64 }}
      run: |
        set -e
        KEYCHAIN_PASSWORD="${KEYCHAIN_PASSWORD:-temporary-release-keychain-password}"
        KEYCHAIN_PATH="$RUNNER_TEMP/droplet-release.keychain-db"

        echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/release-certificate.p12"
        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security import "$RUNNER_TEMP/release-certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
        security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed s/\"//g)
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

        mkdir -p "$RUNNER_TEMP/profiles"
        echo "$MACOS_APP_PROVISION_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profiles/droplet-app.provisionprofile"
        echo "$MACOS_WIDGET_PROVISION_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profiles/droplet-widget.provisionprofile"

        security cms -D -i "$RUNNER_TEMP/profiles/droplet-app.provisionprofile" > "$RUNNER_TEMP/profiles/droplet-app-profile.plist"
        security cms -D -i "$RUNNER_TEMP/profiles/droplet-widget.provisionprofile" > "$RUNNER_TEMP/profiles/droplet-widget-profile.plist"
        /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' "$RUNNER_TEMP/profiles/droplet-app-profile.plist" > "$RUNNER_TEMP/profiles/droplet-app-entitlements.plist"
        /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' "$RUNNER_TEMP/profiles/droplet-widget-profile.plist" > "$RUNNER_TEMP/profiles/droplet-widget-entitlements.plist"

    - name: Generate Xcode Project
      run: xcodegen

    - name: Build app
      env:
        MACOS_CODE_SIGN_IDENTITY: ${{ secrets.MACOS_CODE_SIGN_IDENTITY }}
      run: |
        set -e
        # Build using xcodebuild without code signing
        xcodebuild -project Droplet.xcodeproj -scheme Droplet -configuration Release CODE_SIGNING_ALLOWED=NO -derivedDataPath .build build

        # Copy the built app to the current directory
        cp -R .build/Build/Products/Release/droplet.app ./droplet.app

        # Verify the macOS widget extension is bundled before packaging
        test -d "droplet.app/Contents/PlugIns/DropletWidget.appex"

        # Embed provisioning profiles and sign with a real Developer ID identity.
        # App Groups are required for widgets to share theme, timer, and history data.
        cp "$RUNNER_TEMP/profiles/droplet-app.provisionprofile" "droplet.app/Contents/embedded.provisionprofile"
        cp "$RUNNER_TEMP/profiles/droplet-widget.provisionprofile" "droplet.app/Contents/PlugIns/DropletWidget.appex/Contents/embedded.provisionprofile"

        echo "Signing bundled widget extension..."
        codesign --force --sign "$MACOS_CODE_SIGN_IDENTITY" --timestamp --options runtime --entitlements "$RUNNER_TEMP/profiles/droplet-widget-entitlements.plist" "droplet.app/Contents/PlugIns/DropletWidget.appex"

        echo "Signing app bundle..."
        codesign --force --sign "$MACOS_CODE_SIGN_IDENTITY" --timestamp --options runtime --entitlements "$RUNNER_TEMP/profiles/droplet-app-entitlements.plist" "droplet.app"
        codesign --verify --deep --strict --verbose=2 "droplet.app"
        codesign -d --entitlements :- "droplet.app/Contents/PlugIns/DropletWidget.appex"
        codesign -d --entitlements :- "droplet.app"

        echo "App bundle created and verified: droplet.app"

    - name: Create DMG
      run: |
        set -e

        # Install create-dmg utility
        brew install create-dmg

        # Create DMG using create-dmg for a prettier layout
        echo "Creating DMG..."
        create-dmg \
          --volname "droplet" \
          --volicon "Droplet/Resources/AppIcon.icns" \
          --window-pos 200 120 \
          --window-size 600 300 \
          --icon-size 100 \
          --icon "droplet.app" 175 120 \
          --hide-extension "droplet.app" \
          --app-drop-link 425 120 \
          "droplet-installer.dmg" \
          "droplet.app"

        # Verify DMG was created
        ls -lh droplet-installer.dmg
        echo "DMG created successfully"

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        name: droplet v${{ steps.version.outputs.VERSION }}
        body: |
          ## droplet v${{ steps.version.outputs.VERSION }}

          ### Installation
          1. Download `droplet-installer.dmg`
          2. Open the DMG and drag droplet to Applications
          3. Launch from Applications or Spotlight

          > **Note**: This release is Developer ID signed. If macOS blocks first launch because notarization is not yet enabled, right-click the app and select "Open", or use System Settings > Privacy & Security > Open Anyway.

          ### What's New
          - **macOS Widgets** - Added Today, Streak Garden, and Timer Bucket widgets bundled with the app.
          - **Onboarding and Settings** - Added a fuller first-run configuration flow and refreshed native settings controls.
          - **Focus Sounds** - Added generated focus noise, bundled ambient sounds, custom imports, and a dedicated sound screen.
          - **Menu Bar Polish** - Improved menu-bar window behavior, fullscreen handling, detailed-view transitions, and widget-aligned visuals.
          - **Shared Core Cleanup** - Reorganized the app, widget, and DropletCore architecture for cleaner reuse and future platform work.
          - **Stability Fixes** - Kept Live Activities parked, improved widget refresh behavior, and fixed several app/window edge cases.

          Widgets require macOS 14 or later.
        files: droplet-installer.dmg
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
