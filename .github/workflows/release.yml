name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Get version from tag
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
    

    
    - name: Install xcodegen
      run: brew install xcodegen
      
    - name: Generate Xcode Project
      run: xcodegen
    
    - name: Build app
      run: |
        set -e
        # Build using xcodebuild without code signing
        xcodebuild -project Droplet.xcodeproj -scheme Droplet -configuration Release CODE_SIGNING_ALLOWED=NO -derivedDataPath .build build
        
        # Copy the built app to the current directory
        cp -R .build/Build/Products/Release/droplet.app ./droplet.app
        
        # Sign the app (ad-hoc) to avoid "damaged app" errors
        echo "🔐 Signing app..."
        codesign --force --deep --sign - "droplet.app"
        
        echo "✅ App bundle created: droplet.app"
        
    - name: Create DMG
      run: |
        set -e
        
        # Install create-dmg utility
        brew install create-dmg
        
        # Create DMG using create-dmg for a prettier layout
        echo "Creating DMG..."
        create-dmg \
          --volname "droplet" \
          --volicon "Droplet/Resources/AppIcon.icns" \
          --window-pos 200 120 \
          --window-size 600 300 \
          --icon-size 100 \
          --icon "droplet.app" 175 120 \
          --hide-extension "droplet.app" \
          --app-drop-link 425 120 \
          "droplet-installer.dmg" \
          "droplet.app"
        
        # Verify DMG was created
        ls -lh droplet-installer.dmg
        echo "✅ DMG created successfully"
    
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        name: droplet v${{ steps.version.outputs.VERSION }}
        body: |
          ## droplet v${{ steps.version.outputs.VERSION }}
          
          ### Installation
          1. Download `droplet-installer.dmg`
          2. Open the DMG and drag droplet to Applications
          3. Launch from Applications or Spotlight
          
          > **Note**: On first launch, right-click the app and select "Open" to bypass Gatekeeper.
          
          ### What's New
          - 📝 **Detailed View** - Timer + tasks side by side
          - 👁️ **20-20-20 Rule** - Eye health full-screen overlay
          - 🚀 **Onboarding Flow** - Quick start guide
          - 🐛 **Bug Fixes** - Fixed window lifecycle and background bugs
        files: droplet-installer.dmg
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}